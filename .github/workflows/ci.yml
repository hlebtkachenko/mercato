name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:   # manual / agent-triggered runs (gh workflow run CI)
  merge_group:         # merge-queue ready

# Least privilege by default; jobs widen only what they need.
permissions:
  contents: read

# New pushes to the same ref cancel in-flight runs -> faster feedback, less waste.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable Corepack (Yarn 4)
        run: corepack enable
      - name: Resolve Yarn cache dir
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - name: Cache Yarn downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-node24-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node24-yarn-
      - name: Install
        run: yarn install --immutable
      - name: Generate framework artifacts
        run: yarn generate
      - name: Typecheck
        run: yarn typecheck
      - name: Test
        run: yarn test
      - name: Summary
        if: always()
        run: echo "typecheck + test → **${{ job.status }}**" >> "$GITHUB_STEP_SUMMARY"

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          # gitleaks-action v3 requires GITHUB_TOKEN to scan pull_request events
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
